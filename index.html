<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum RNG</title>
    <meta name="description" content="Secure, premium random number generator">
    <meta name="theme-color" content="#050511">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="bg-particles"></div>

    <div class="container">
        <!-- Mode Selection Screen -->
        <div class="mode-screen" id="modeScreen">
            <div class="mode-header">
                <h1><span class="title-gradient">Quantum</span> RNG</h1>
                <p>True random number generation</p>
            </div>

            <div class="mode-grid">
                <div class="mode-card" id="soloModeBtn">
                    <div class="mode-icon">⚡</div>
                    <div class="mode-title">Quick Generate</div>
                    <div class="mode-desc">Instant number generation with customizable ranges and options.</div>
                </div>

                <div class="mode-card" id="multiModeBtn">
                    <div class="mode-icon">🎲</div>
                    <div class="mode-title">Game Mode</div>
                    <div class="mode-desc">Perfect for board games and multiplayer sessions.</div>
                </div>
            </div>
        </div>

        <!-- Player Setup Screen -->
        <div class="setup-screen" id="setupScreen" style="display: none;">
            <div class="controls-panel">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Player Setup</h2>

                <div class="control-group">
                    <label class="control-label">Number of Players</label>
                    <input type="number" id="setupNumPlayers" min="2" max="8" value="2">
                </div>

                <div class="control-group" style="margin-top: 1rem;">
                    <label class="control-label">Player Initials</label>
                    <div class="input-wrapper">
                        <input type="text" id="playerInitials" placeholder="Type & Enter" maxlength="3">
                        <button class="btn-icon" id="addPlayerBtn">+</button>
                    </div>
                </div>

                <div class="player-chips" id="playerChips">
                    <!-- Chips injected by JS -->
                </div>

                <button class="btn btn-primary" id="startGameBtn">
                    <span>START GAME</span>
                </button>

                <button class="btn btn-secondary" id="cancelSetupBtn" style="margin-top: 1rem; width: 100%;">
                    Cancel
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <!-- Multiplayer Header -->
            <div class="game-header" id="multiplayerHeader" style="display: none;">
                <div class="current-player-badge">
                    <div class="player-dot" id="currentPlayerDot"></div>
                    <span id="currentPlayerName">Player 1</span>
                </div>
                <div class="turn-indicator">YOUR TURN</div>
            </div>

            <div class="controls-panel">
                <div class="controls-grid">
                    <div class="control-group">
                        <label class="control-label">Count</label>
                        <input type="number" id="numCount" value="2" min="1" max="12">
                    </div>
                    <div class="control-group">
                        <label class="control-label">Min</label>
                        <input type="number" id="minVal" value="1">
                    </div>
                    <div class="control-group">
                        <label class="control-label">Max</label>
                        <input type="number" id="maxVal" value="6">
                    </div>
                </div>

                <div class="checkbox-wrapper">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="noDuplicates">
                        <div class="custom-checkbox"></div>
                        <span style="font-size: 0.9rem; color: var(--text-secondary);">No Duplicates</span>
                    </label>
                </div>

                <button class="btn btn-primary" id="generateBtn">
                    <span>GENERATE</span>
                </button>
            </div>

            <div class="results-grid" id="resultsGrid">
                <!-- Cards injected by JS -->
            </div>

            <!-- Total Display -->
            <div class="total-display" id="totalDisplay" style="display: none;">
                <span class="total-label">TOTAL</span>
                <span class="total-value" id="totalValue">0</span>
            </div>

            <button class="btn btn-primary" id="nextPlayerBtn"
                style="display: none; background: linear-gradient(135deg, #00ff9d 0%, #00b8ff 100%);">
                NEXT PLAYER →
            </button>

            <button class="btn btn-secondary" id="backBtn" style="align-self: center;">
                ← Back to Menu
            </button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>

</html>

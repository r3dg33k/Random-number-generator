<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator</title>
    <meta name="description" content="AI-powered multiplayer game number generator">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%236366f1'/%3E%3Ctext x='50%25' y='50%25' font-size='50' fill='white' text-anchor='middle' dy='.3em'%3E%23%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent-primary: #6366f1;
            --border-color: rgba(99, 102, 241, 0.3);
            --glass-bg: rgba(30, 41, 59, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            min-height: 100vh;
            height: 100vh;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Mode Selection Screen */
        .mode-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            animation: fadeIn 0.5s ease;
        }

        .mode-screen.hidden {
            display: none;
        }

        .mode-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .mode-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.75rem;
        }

        .mode-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .mode-options {
            display: grid;
            gap: 1.5rem;
            width: 100%;
            max-width: 500px;
        }

        .mode-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mode-card:active::before {
            opacity: 1;
        }

        .mode-card:active {
            transform: scale(0.98);
            border-color: #818cf8;
        }

        .mode-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .mode-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .mode-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Quick Setup - Inline */
        .quick-setup {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideDown 0.4s ease;
        }

        .quick-setup.hidden {
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .setup-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .setup-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .setup-field label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        input[type="number"],
        input[type="text"] {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="text"] {
            text-transform: uppercase;
        }

        input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .player-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .player-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.9rem;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .player-chip-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .btn-setup {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            padding: 0.875rem 1.5rem;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-setup:active {
            transform: scale(0.98);
        }

        /* Game Screen */
        .game-screen {
            display: none;
            flex-direction: column;
            padding-top: 1rem;
            flex: 1;
        }

        .game-screen.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .current-player {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .player-indicator {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .player-name {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .back-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        /* Number Display */
        .numbers-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex: 1;
            align-content: start;
        }

        .number-box {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            backdrop-filter: blur(20px);
            border: 3px solid;
            border-radius: 20px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            min-height: 140px;
        }

        .number-box.generating {
            animation: glow 0.6s ease-in-out;
        }

        @keyframes glow {
            0% { 
                transform: scale(1);
                box-shadow: 0 0 0 rgba(99, 102, 241, 0);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.6);
            }
            100% { 
                transform: scale(1);
                box-shadow: 0 0 0 rgba(99, 102, 241, 0);
            }
        }

        .number-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .number-value {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .number-value.empty {
            color: #475569;
        }

        .number-value.flipping {
            animation: numberFlip 0.5s ease-in-out;
        }

        @keyframes numberFlip {
            0% { 
                transform: rotateX(0deg);
                opacity: 1;
            }
            50% { 
                transform: rotateX(90deg);
                opacity: 0;
            }
            100% { 
                transform: rotateX(0deg);
                opacity: 1;
            }
        }

        .action-buttons {
            display: grid;
            gap: 1rem;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #8b5cf6 100%);
            border: none;
            border-radius: 16px;
            padding: 1.125rem 2rem;
            color: white;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
        }

        .btn-generate:active {
            transform: translateY(2px);
        }

        .btn-next {
            width: 100%;
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
            border-radius: 16px;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
        }

        .btn-next.active {
            display: block;
        }

        .btn-next:active {
            transform: scale(0.98);
        }

        /* Total Display */
        .total-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.4s ease;
        }

        .total-box {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
            backdrop-filter: blur(20px);
            border: 3px solid rgba(34, 197, 94, 0.5);
            border-radius: 20px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 140px;
        }

        .total-label {
            font-size: 0.7rem;
            color: #86efac;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .total-value {
            font-size: 3rem;
            font-weight: 700;
            color: #22c55e;
            font-variant-numeric: tabular-nums;
        }

        /* AI Badge */
        .ai-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .ai-badge-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 640px) {
            .mode-title {
                font-size: 2rem;
            }

            .numbers-container {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 0.75rem;
            }

            .number-box {
                padding: 1.5rem 0.75rem;
                min-height: 120px;
            }

            .number-value {
                font-size: 2.5rem;
            }

            .total-display {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 0.75rem;
            }

            .total-box {
                padding: 1.5rem 0.75rem;
                min-height: 120px;
            }

            .total-value {
                font-size: 2.5rem;
            }

            .game-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .setup-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Mode Selection Screen -->
    <div class="mode-screen" id="modeScreen">
        <div class="mode-header">
            <h1 class="mode-title">Game Number Generator</h1>
            <p class="mode-subtitle">Choose your mode</p>
        </div>

        <div class="mode-options">
            <div class="mode-card" id="soloModeBtn">
                <div class="mode-icon">⚡</div>
                <div class="mode-name">Quick Generate</div>
                <div class="mode-description">Generate numbers instantly without player setup</div>
            </div>

            <div class="mode-card" id="multiModeBtn">
                <div class="mode-icon">👥</div>
                <div class="mode-name">Multiplayer Mode</div>
                <div class="mode-description">Turn-based game with multiple players</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="game-screen" id="gameScreen">
        <div class="container">
            <!-- Quick Setup (shown inline, no scrolling) -->
            <div class="quick-setup" id="quickSetup">
                <div class="setup-row">
                    <div class="setup-field">
                        <label>Numbers</label>
                        <input type="number" inputmode="numeric" pattern="[0-9]*" id="numCount" min="1" max="6" value="1">
                    </div>
                    <div class="setup-field">
                        <label>Range</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="number" inputmode="numeric" pattern="[0-9]*" id="minVal" value="1" style="width: 60px;">
                            <span style="color: var(--text-muted);">-</span>
                            <input type="number" inputmode="numeric" pattern="[0-9]*" id="maxVal" value="6" style="width: 60px;">
                        </div>
                    </div>
                </div>
                
                <!-- Player setup (only shown in multiplayer) -->
                <div id="playerSetupSection" style="display: none;">
                    <div class="setup-field" style="margin-bottom: 1rem;">
                        <label>Players (2-8)</label>
                        <input type="number" inputmode="numeric" pattern="[0-9]*" id="numPlayers" min="2" max="8" value="2">
                    </div>
                    <div class="player-chips" id="playerChips"></div>
                    <div class="setup-field" style="margin-bottom: 0.5rem;">
                        <label>Player Initials</label>
                        <input type="text" inputmode="text" id="playerInitials" placeholder="e.g., JD" maxlength="3">
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; font-style: italic;">
                        💡 Press Enter after typing each player's initials
                    </div>
                </div>

                <button class="btn-setup" id="startBtn">Start</button>
            </div>

            <!-- Game Header (only shown in multiplayer after start) -->
            <div class="game-header" id="gameHeader" style="display: none;">
                <div class="current-player">
                    <div class="player-indicator" id="currentPlayerColor"></div>
                    <div>
                        <div class="player-name" id="currentPlayerName"></div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Your Turn</div>
                    </div>
                </div>
                <button class="back-btn" id="backBtn">← Back</button>
            </div>

            <!-- Numbers Display -->
            <div class="numbers-container" id="numbersContainer"></div>

            <!-- Total Display -->
            <div class="total-display" id="totalDisplay" style="display: none;">
                <div class="total-box">
                    <span class="total-label">Total</span>
                    <div class="total-value" id="totalValue">0</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-generate" id="generateBtn">✨ Generate Numbers</button>
                <button class="btn-next" id="nextBtn">Next Player →</button>
            </div>

            <!-- AI Badge -->
            <div class="ai-badge">
                <div class="ai-badge-icon">✦</div>
                <span>Powered by AI Randomness</span>
            </div>
        </div>
    </div>

    <script>
        const PLAYER_COLORS = [
            '#ef4444', '#f59e0b', '#10b981', '#3b82f6',
            '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'
        ];

        let gameState = {
            mode: 'solo',
            players: [],
            currentPlayerIndex: 0,
            numCount: 1,
            minVal: 1,
            maxVal: 6,
            hasGenerated: false
        };

        // Wake Lock - Improved Implementation
        window.currentWakeLock = null;

        async function lockScreen() {
            if (!navigator.wakeLock) {
                console.log("Wake Lock API not supported");
                return;
            }
            try {
                window.currentWakeLock = await navigator.wakeLock.request('screen');
                console.log('Wake Lock enabled');
                
                window.currentWakeLock.addEventListener('release', () => {
                    console.log('Wake Lock released');
                });
            } catch(err) {
                console.log('Wake Lock error:', err);
            }
        }

        async function releaseScreen() {
            if (window.currentWakeLock && !window.currentWakeLock.released) {
                await window.currentWakeLock.release();
                window.currentWakeLock = null;
            }
        }

        async function toggleWakeLock() {
            if (!navigator.wakeLock) {
                console.log("Your device does not support the Wake Lock API");
                return;
            }
            if (window.currentWakeLock && !window.currentWakeLock.released) {
                await releaseScreen();
            } else {
                await lockScreen();
            }
        }

        // Request wake lock when page loads
        lockScreen();

        // Re-request wake lock when page becomes visible
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                await lockScreen();
            }
        });

        // Mode Selection
        document.getElementById('soloModeBtn').addEventListener('click', () => {
            gameState.mode = 'solo';
            document.getElementById('modeScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('playerSetupSection').style.display = 'none';
        });

        document.getElementById('multiModeBtn').addEventListener('click', () => {
            gameState.mode = 'multi';
            document.getElementById('modeScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('playerSetupSection').style.display = 'block';
            setupPlayerInput();
        });

        // Player Input Setup
        function setupPlayerInput() {
            const numPlayersInput = document.getElementById('numPlayers');
            const initialsInput = document.getElementById('playerInitials');
            const playerChips = document.getElementById('playerChips');

            // Update player fields when number of players changes
            numPlayersInput.addEventListener('input', () => {
                const numPlayers = parseInt(numPlayersInput.value) || 2;
                updatePlayerFields(numPlayers);
            });

            initialsInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && initialsInput.value.trim()) {
                    addPlayer(initialsInput.value.trim().toUpperCase());
                    initialsInput.value = '';
                    
                    // Auto-focus back to input if more players needed
                    const numPlayers = parseInt(document.getElementById('numPlayers').value);
                    if (gameState.players.length < numPlayers) {
                        initialsInput.focus();
                    }
                }
            });

            // Initialize with 2 players
            updatePlayerFields(2);
        }

        function updatePlayerFields(numPlayers) {
            // Clear existing players if reducing count
            if (gameState.players.length > numPlayers) {
                gameState.players = gameState.players.slice(0, numPlayers);
                renderPlayerChips();
            }
        }

        function renderPlayerChips() {
            const playerChips = document.getElementById('playerChips');
            playerChips.innerHTML = '';
            
            gameState.players.forEach(player => {
                const chip = document.createElement('div');
                chip.className = 'player-chip';
                chip.innerHTML = `
                    <div class="player-chip-color" style="background: ${player.color}"></div>
                    <span>${player.initials}</span>
                `;
                playerChips.appendChild(chip);
            });
        }

        function addPlayer(initials) {
            const numPlayers = parseInt(document.getElementById('numPlayers').value);
            if (gameState.players.length >= numPlayers) {
                alert(`Maximum ${numPlayers} players allowed. Change "Players" number to add more.`);
                return;
            }

            const player = {
                initials: initials,
                color: PLAYER_COLORS[gameState.players.length]
            };
            gameState.players.push(player);
            renderPlayerChips();
        }

        // Start Game
        document.getElementById('startBtn').addEventListener('click', () => {
            gameState.numCount = parseInt(document.getElementById('numCount').value);
            gameState.minVal = parseInt(document.getElementById('minVal').value);
            gameState.maxVal = parseInt(document.getElementById('maxVal').value);

            if (gameState.minVal >= gameState.maxVal) {
                alert('Minimum must be less than maximum!');
                return;
            }

            if (gameState.mode === 'multi') {
                const numPlayers = parseInt(document.getElementById('numPlayers').value);
                if (gameState.players.length < numPlayers) {
                    alert(`Please add all ${numPlayers} players. You have ${gameState.players.length} so far.`);
                    return;
                }
                document.getElementById('gameHeader').style.display = 'flex';
                updateCurrentPlayer();
            }

            document.getElementById('quickSetup').style.display = 'none';
            createNumberBoxes();
        });

        function createNumberBoxes() {
            const container = document.getElementById('numbersContainer');
            container.innerHTML = '';

            const borderColor = gameState.mode === 'multi' 
                ? gameState.players[gameState.currentPlayerIndex].color 
                : '#6366f1';
            const textColor = borderColor;

            for (let i = 0; i < gameState.numCount; i++) {
                const box = document.createElement('div');
                box.className = 'number-box';
                box.style.borderColor = borderColor;
                box.innerHTML = `
                    <span class="number-label">Number ${i + 1}</span>
                    <div class="number-value empty" style="color: ${textColor}">?</div>
                `;
                container.appendChild(box);
            }
        }

        function updateCurrentPlayer() {
            const player = gameState.players[gameState.currentPlayerIndex];
            document.getElementById('currentPlayerColor').style.background = player.color;
            document.getElementById('currentPlayerName').textContent = player.initials;
            createNumberBoxes();
            document.getElementById('nextBtn').classList.remove('active');
            document.getElementById('totalDisplay').style.display = 'none';
            gameState.hasGenerated = false;
        }

        // Generate Numbers
        document.getElementById('generateBtn').addEventListener('click', () => {
            if (gameState.hasGenerated && gameState.mode === 'multi') return;

            const boxes = document.querySelectorAll('.number-box');
            const generatedNumbers = [];
            
            boxes.forEach((box, index) => {
                box.classList.add('generating');
                const valueElement = box.querySelector('.number-value');
                valueElement.classList.add('flipping');
                
                let flipCount = 0;
                const flipInterval = setInterval(() => {
                    if (flipCount < 8) {
                        const tempValue = Math.floor(Math.random() * (gameState.maxVal - gameState.minVal + 1)) + gameState.minVal;
                        valueElement.textContent = tempValue;
                        flipCount++;
                    } else {
                        clearInterval(flipInterval);
                    }
                }, 50);
                
                setTimeout(() => {
                    const value = Math.floor(Math.random() * (gameState.maxVal - gameState.minVal + 1)) + gameState.minVal;
                    generatedNumbers.push(value);
                    valueElement.textContent = value;
                    valueElement.classList.remove('empty', 'flipping');
                    box.classList.remove('generating');
                }, 500);
            });

            setTimeout(() => {
                // Calculate and display total
                const total = generatedNumbers.reduce((sum, num) => sum + num, 0);
                document.getElementById('totalValue').textContent = total;
                document.getElementById('totalDisplay').style.display = 'flex';

                if (gameState.mode === 'multi') {
                    gameState.hasGenerated = true;
                    document.getElementById('nextBtn').classList.add('active');
                }
            }, 600);
        });

        // Next Player
        document.getElementById('nextBtn').addEventListener('click', () => {
            gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
            updateCurrentPlayer();
        });

        // Back Button
        document.getElementById('backBtn').addEventListener('click', () => {
            if (confirm('Go back to mode selection?')) {
                location.reload();
            }
        });

        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .catch(err => console.log('Service Worker registration failed'));
            });
        }
    </script>
</body>
</html>
